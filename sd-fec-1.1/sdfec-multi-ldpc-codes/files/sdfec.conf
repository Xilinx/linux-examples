# SD-FEC Example Design Configuration
#
# Base addresses of PL IP blocks (hex, from Vivado address editor)
DATA_DEV_BASEADDR=0x80080000
STATS_DEV_BASEADDR=0x800e0000
ENC_IP_MON_DEV_BASEADDR=0x80090000
ENC_OP_MON_DEV_BASEADDR=0x800a0000
DEC_IP_MON_DEV_BASEADDR=0x800b0000
DEC_OP_MON_DEV_BASEADDR=0x800c0000

# GPIO line names (from device tree)
GPIO_PIN_RESET=RESET

# SD-FEC device nodes
FEC_DEC=/dev/xsdfec0
FEC_ENC=/dev/xsdfec1
